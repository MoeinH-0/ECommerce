services:
  ecommerce_db:
    image: postgres:16
    container_name: ecommerce_db_prod
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ecommerce_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  ecommerce_web:
    image: moeinh/ecommerce:latest
    container_name: ecommerce_web_prod
    restart: always
    expose:
      - "8080"
    volumes:
      - ./ProductPictures:/app/wwwroot/ProductPictures
    depends_on:
      ecommerce_db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ShopDatabase=Host=ecommerce_db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Payment__method=${PAYMENT_METHOD}
      - Payment__merchant=${ZARINPAL_MERCHANT}
      - Payment__url=${PAYMENT_URL}
    networks:
      - ecommerce_network
      - shared_network

volumes:
  postgres_data:

networks:
  ecommerce_network:
    driver: bridge
  shared_network:
    external: true
    name: shared_network